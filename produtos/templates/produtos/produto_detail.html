<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>{{ object.nome }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">

            <h2 class="mb-4">{{ object.nome }}</h2>

            <div class="card shadow-sm mb-4">
                <ul class="list-group list-group-flush">
                    <li class="list-group-item">
                        <span class="text-muted">Preço:</span>
                        <strong class="ms-2">R$ {{ object.preco }}</strong>
                    </li>
                    <li class="list-group-item">
                        <span class="text-muted">Descrição:</span>
                        <span class="ms-2">{{ object.descricao }}</span>
                    </li>
                </ul>
            </div>

            <div class="d-flex gap-2">
                <a href="{% url 'produto_list' %}" class="btn btn-outline-secondary">Voltar</a>
                <a href="{% url 'produto_update' object.id %}" class="btn btn-primary">Editar</a>
                <a href="{% url 'produto_delete' object.id %}" class="btn btn-danger">Excluir</a>
            </div>

        </div>
    </div>
</div>
</body>
</html>
