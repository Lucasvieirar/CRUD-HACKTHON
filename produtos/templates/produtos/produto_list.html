<!DOCTYPE html>
<html>
<head>
    <title>Lista de Produtos</title>
</head>
<body>
    <h1>Produtos</h1>

    <a href="{% url 'produto_create' %}">Novo Produto</a>

    <ul>
        {% for produto in object_list %}
            <li>
                <strong>{{ produto.nome }}</strong> - R$ {{ produto.preco }}

                <a href="{% url 'produto_detail' produto.id %}">Ver</a>
                <a href="{% url 'produto_update' produto.id %}">Editar</a>
                <a href="{% url 'produto_delete' produto.id %}">Excluir</a>
            </li>
        {% empty %}
            <li>Nenhum produto cadastrado.</li>
        {% endfor %}
    </ul>
</body>
</html>
