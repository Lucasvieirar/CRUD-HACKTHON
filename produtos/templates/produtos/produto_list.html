<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Produtos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Produtos</h2>
        <a href="{% url 'produto_create' %}" class="btn btn-primary">+ Novo Produto</a>
    </div>

    <div class="card shadow-sm">
        <ul class="list-group list-group-flush">
            {% for produto in object_list %}
            <li class="list-group-item d-flex justify-content-between align-items-center">
                <div>
                    <strong>{{ produto.nome }}</strong>
                    <span class="text-muted ms-2">R$ {{ produto.preco }}</span>
                </div>
                <div class="d-flex gap-2">
                    <a href="{% url 'produto_detail' produto.id %}" class="btn btn-sm btn-outline-secondary">Ver</a>
                    <a href="{% url 'produto_update' produto.id %}" class="btn btn-sm btn-outline-primary">Editar</a>
                    <a href="{% url 'produto_delete' produto.id %}" class="btn btn-sm btn-outline-danger">Excluir</a>
                </div>
            </li>
            {% empty %}
            <li class="list-group-item text-muted">Nenhum produto cadastrado.</li>
            {% endfor %}
        </ul>
    </div>

</div>
</body>
</html>
